<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Terminal | Akshay Srinivas</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Send messages to Akshay Srinivas via the interactive cosmic command line console.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Theme CSS Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>

    <!-- Shared Canvas Starfield backdrop -->
    <canvas id="starfield"></canvas>
    <div class="nebula-glow"></div>

    <!-- HUD System Menu -->
    <button class="hud-btn audio-btn" aria-label="Toggle ambient space sound waves">Ambience: Off</button>
    <a href="index.html" class="hud-btn home-btn" aria-label="Navigate back to Home screen">
        <svg viewBox="0 0 24 24"><path d="M21 13v10h-6v-6h-6v6h-6v-10h-3l12-12 12 12h-3zm-1-5.907v-5.093h-3v2.093l3 3z"/></svg>
        Home
    </a>

    <!-- Main Dynamic Application Container -->
    <main class="hero-container" id="app-root" tabindex="-1">
        
        <div class="page-wrapper glass-panel">
            <header class="page-header">
                <h1 class="page-title">Cosmic Terminal</h1>
                <p class="page-subtitle">Communicate via deep-space shell lines. Type assistance command to list options.</p>
            </header>

            <div class="terminal-container">
                <div class="terminal-header">
                    <span>STATUS: ONLINE</span>
                    <span>COSMIC SH [PORT 8080]</span>
                </div>
                
                <div class="terminal-body" id="terminal-output">Cosmic Terminal System [v1.0.8]
Type "help" to list available commands.</div>

                <form class="terminal-input-line" id="terminal-form" autocomplete="off">
                    <span class="terminal-prompt">akshay@space:~$</span>
                    <input type="text" id="terminal-input" class="terminal-field" aria-label="Terminal command prompt field" autofocus>
                </form>
            </div>
        </div>

    </main>

    <!-- Portal Transition Splash Overlays -->
    <div class="portal-transition">
        <div class="portal-layer portal-layer-1"></div>
        <div class="portal-layer portal-layer-2"></div>
    </div>

    <!-- Application Execution Scripts -->
    <script src="js/transition.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
