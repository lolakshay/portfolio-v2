<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate Loot Chest</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;

background:
radial-gradient(
circle,
#1a1a1a,
#050505
);

}

canvas{
display:block;
}

#hint{

position:fixed;

top:20px;
left:50%;

transform:translateX(-50%);

color:white;

opacity:.8;

z-index:100;

}


#closeButton{

position:fixed;

top:30px;
right:30px;

width:60px;
height:60px;

display:none;

justify-content:center;
align-items:center;

border-radius:50%;

background:#ff2d2d;

font-size:35px;

color:white;

cursor:pointer;

z-index:999;

box-shadow:
0 0 30px red;

user-select:none;

}


#cardContainer{

position:fixed;

inset:0;

pointer-events:none;

z-index:500;

}



.card{

position:absolute;

width:180px;
height:250px;

border-radius:20px;

display:flex;

justify-content:center;
align-items:center;

font-size:22px;

font-weight:bold;

color:white;

opacity:0;

transform:

translate(-50%,-50%)
rotateY(180deg)
scale(.1);

border:
2px solid rgba(255,255,255,.2);

backdrop-filter:blur(12px);

box-shadow:
0 0 30px rgba(255,255,255,.2);

}



.common{

background:#888;

}


.rare{

background:#2f7cff;

}


.epic{

background:#aa00ff;

}


.legendary{

background:#ffb800;

box-shadow:
0 0 50px gold;

}

</style>


<script src=
"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>

<script src=
"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js">
</script>

<script src=
"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
</script>

<script src=
"https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
</script>

</head>

<body>


<div id="hint">
Click chest
</div>


<div id="closeButton">
✕
</div>


<div id="cardContainer">
</div>



<script>

//////////////////////////////////////////////////////
// SCENE
//////////////////////////////////////////////////////

const scene=
new THREE.Scene();


const camera=
new THREE.PerspectiveCamera(

55,

window.innerWidth/
window.innerHeight,

0.1,

1000

);

camera.position.set(
2.5,
1.8,
4.2
);


const renderer=
new THREE.WebGLRenderer({

antialias:true

});

renderer.outputEncoding=
THREE.sRGBEncoding;

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
window.devicePixelRatio
);

document.body.appendChild(
renderer.domElement
);


//////////////////////////////////////////////////////
// CONTROLS
//////////////////////////////////////////////////////

const controls=
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enablePan=false;

controls.enableDamping=true;

controls.target.set(
0,
0.7,
0
);


//////////////////////////////////////////////////////
// LIGHTS
//////////////////////////////////////////////////////

scene.add(

new THREE.AmbientLight(
0xffffff,
2
)

);


const mainLight=
new THREE.DirectionalLight(
0xffffff,
6
);

mainLight.position.set(
5,
10,
5
);

scene.add(
mainLight
);


const rim=
new THREE.DirectionalLight(
0x66aaff,
4
);

rim.position.set(
-5,
4,
-5
);

scene.add(
rim
);


const warm=
new THREE.PointLight(
0xffcc88,
8
);

warm.position.set(
0,
4,
2
);

scene.add(
warm
);



//////////////////////////////////////////////////////
// VARIABLES
//////////////////////////////////////////////////////

let chest;

let latch;

let mixer;

let openAnim;

let closeAnim;

let opened=false;

const cards=[];

const clock=
new THREE.Clock();



//////////////////////////////////////////////////////
// CERTIFICATES
//
// ADD MORE HERE
//////////////////////////////////////////////////////

const certificateData=[

{
name:"Python",
rarity:"common"
},

{
name:"Hackathon",
rarity:"rare"
},

{
name:"AI Bot",
rarity:"epic"
},

{
name:"ICPC",
rarity:"legendary"
},

{
name:"Web Lead",
rarity:"epic"
},

{
name:"Internship",
rarity:"legendary"
},

{
name:"CTF",
rarity:"rare"
},

{
name:"ML",
rarity:"common"
}

];


//////////////////////////////////////////////////////
// CREATE HTML CARDS
//////////////////////////////////////////////////////

function createCards(){

const container=
document.getElementById(
"cardContainer"
);


certificateData.forEach(
(cert)=>{


const card=
document.createElement(
"div"
);


card.className=
"card "+
cert.rarity;


card.innerHTML=
cert.name;


container.appendChild(
card
);

cards.push(
card
);

});

}


//////////////////////////////////////////////////////
// CARD REVEAL
//////////////////////////////////////////////////////

function revealCards(){


document
.getElementById(
"closeButton"
)
.style.display="flex";



const positions=[

{x:10,y:20},
{x:35,y:20},
{x:65,y:20},
{x:90,y:20},

{x:10,y:75},
{x:35,y:75},
{x:65,y:75},
{x:90,y:75}

];


cards.forEach(
(card,index)=>{


const p=
positions[index];


const tl=
gsap.timeline({

delay:
index*.25

});


//////////////////////////////////////////////////////
// EMERGE FROM CHEST CENTER
//////////////////////////////////////////////////////

tl.fromTo(
card,

{

left:"50%",
top:"58%",

opacity:0,

scale:.1

},

{

opacity:1,

scale:1.2,

duration:.5

}

)



//////////////////////////////////////////////////////
// FLY OUT
//////////////////////////////////////////////////////

.to(
card,

{

left:
p.x+"%",

top:
p.y+"%",

scale:1,

duration:1,

ease:
"back.out(1.7)"

}

)



//////////////////////////////////////////////////////
// FLIP
//////////////////////////////////////////////////////

.to(
card,
{

rotateY:0,

duration:.6

}
);

});

}


//////////////////////////////////////////////////////
// LOAD CHEST
//////////////////////////////////////////////////////

new THREE.GLTFLoader().load(

"./treasure_chest.glb",

(gltf)=>{


chest=
gltf.scene;

scene.add(
chest
);


mixer=
new THREE.AnimationMixer(
chest
);



openAnim=
mixer.clipAction(

THREE.AnimationClip.findByName(

gltf.animations,

"chest_rig|chest_open_anim"

)

);



closeAnim=
mixer.clipAction(

THREE.AnimationClip.findByName(

gltf.animations,

"chest_rig|chest_close_anim"

)

);



[openAnim,closeAnim]
.forEach(a=>{

a.setLoop(
THREE.LoopOnce
);

a.clampWhenFinished=true;

});



chest.traverse(
(obj)=>{

if(
obj.name==="chest_latch"
){

latch=obj;

}

});



createCards();



window.addEventListener(
"click",
()=>{

if(opened)return;


openAnim.reset();

openAnim.play();

opened=true;



setTimeout(()=>{

if(latch){

latch.visible=false;

}

},300);



setTimeout(()=>{

revealCards();

},900);


});

});



//////////////////////////////////////////////////////
// X BUTTON
//////////////////////////////////////////////////////

document
.getElementById(
"closeButton"
)
.onclick=()=>{


document
.getElementById(
"closeButton"
)
.style.display="none";



cards.forEach(
(card,index)=>{


gsap.to(
card,
{

x:
Math.random()*1600-800,

y:
Math.random()*1000-500,

rotation:
Math.random()*720,

scale:0,

opacity:0,

duration:1.2,

delay:index*.04,

ease:
"power4.out"

}

);

});



setTimeout(()=>{


if(latch){

latch.visible=true;

}


closeAnim.reset();

closeAnim.play();

opened=false;



cards.forEach(
card=>{

gsap.set(
card,
{

clearProps:"all"

});

card.style.opacity=0;

});

},1200);

};



//////////////////////////////////////////////////////
// LOOP
//////////////////////////////////////////////////////

function animate(){

requestAnimationFrame(
animate
);

if(mixer){

mixer.update(
clock.getDelta()
);

}


if(
latch &&
opened
){

latch.visible=false;

}


controls.update();

renderer.render(
scene,camera
);

}

animate();



window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
