<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Corner | Akshay Srinivas</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Subtle, bass-reactive space radio station and music player by Akshay Srinivas.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Theme CSS Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/pages.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('cosmic-theme') || 'purple');
    </script>
</head>
<body>

    <!-- Shared Canvas Starfield backdrop -->
    <canvas id="starfield"></canvas>
    <div class="nebula-glow"></div>

    <!-- Standalone Floating Controls -->
    <button class="floating-control-btn theme-toggle-btn" id="nav-theme-btn" aria-label="Cycle Theme Color">
        <svg class="nav-svg-icon" viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.01c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
    </button>

    <div class="floating-right-controls">
        <button class="floating-control-btn audio-btn" id="nav-audio-btn" aria-label="Toggle ambient soundwaves"></button>
        <button class="floating-control-btn hamburger-btn" id="nav-hamburger" aria-label="Toggle navigation menu">
            <span class="hamburger-line line-1"></span>
            <span class="hamburger-line line-2"></span>
            <span class="hamburger-line line-3"></span>
        </button>
    </div>

    <!-- Cosmic Menu Overlay -->
    <div class="cosmic-menu-overlay" id="cosmic-menu-overlay">
        <div class="menu-overlay-inner">
            <div class="menu-grid-container">
                <a href="index.html" class="menu-card card-tilt-1">
                    <span class="menu-card-num">01</span>
                    <span class="menu-card-title">home</span>
                </a>
                <!-- <a href="about.html" class="menu-card card-tilt-2">
                    <span class="menu-card-num">02</span>
                    <span class="menu-card-title">about</span>
                </a> -->
                <a href="resume.html" class="menu-card card-tilt-3">
                    <span class="menu-card-num">02</span>
                    <span class="menu-card-title">resume</span>
                </a>
                <a href="projects.html" class="menu-card card-tilt-4">
                    <span class="menu-card-num">03</span>
                    <span class="menu-card-title">projects</span>
                </a>
                <a href="certificates.html" class"menu-card card-tilt-5">
                    <span class="menu-card-num">04</span>
                    <span class="menu-card-title">certificates</span>
                </a>
                <a href="music.html" class="menu-card card-tilt-6">
                    <span class="menu-card-num">05</span>
                    <span class="menu-card-title">music</span>
                </a>
                <a href="contact.html" class="menu-card card-tilt-7">
                    <span class="menu-card-num">06</span>
                    <span class="menu-card-title">contact</span>
                </a>
            </div>

            <div class="menu-overlay-footer">
                <div class="footer-meta">GTA V</div>
            </div>
        </div>
    </div>

    <!-- Main Dynamic Application Container -->
    <main class="hero-container" id="app-root" tabindex="-1">
        
        <div class="page-wrapper glass-panel music-page-wrapper">
            <header class="page-header" style="text-align: center; margin-bottom: 8px; z-index: 10;">
                <h1 class="page-title">Music Corner</h1>
                <p class="page-subtitle">Vibrant, bass-reactive cosmic visualizer and album player.</p>
            </header>

            <div class="music-console-grid">
                <!-- Left Side: Visualizer Canvas taking full vertical space (no separate box) -->
                <div class="visualizer-panel-fullheight">
                    <canvas id="star-visualizer"></canvas>
                </div>

                <!-- Right Side: Song cover grid -->
                <div class="playlist-panel">
                    <div class="music-tiles-grid" id="music-tiles-grid">
                        <!-- Dynamically populated via js/music.js -->
                    </div>
                </div>
            </div>

            <!-- Bottom: The Music Bar (Controls & Waveform Progress Timeline) -->
            <div class="music-player-bar" id="music-player-bar">
                <!-- Equalizer lines embedded at the top of the player bar -->
                <div class="vis-lines-container" style="position: absolute; top: -1px; left: 0; right: 0; width: 100%; padding: 0 20px; z-index: 10; display: flex; flex-direction: column; gap: 3px;">
                    <div class="vis-line green-vis-line" id="vis-line-green" style="height: 2px; border-radius: 1px; width: 65%;"></div>
                    <div class="vis-line yellow-vis-line" id="vis-line-yellow" style="height: 2px; border-radius: 1px; width: 45%;"></div>
                </div>

                <div class="player-bar-upper" style="margin-top: 5px;">
                    <!-- Left: Song details -->
                    <div class="player-track-info">
                        <img src="assets/song-album-covers/i-wanna-be-yours.jpg" class="player-track-cover" id="player-cover" alt="Album Cover">
                        <div class="player-track-meta">
                            <span class="player-track-title" id="player-title">I Wanna Be Yours</span>
                            <span class="player-track-artist" id="player-artist">Arctic Monkeys</span>
                        </div>
                    </div>

                    <!-- Center: Playback controls -->
                    <div class="player-controls">
                        <button class="player-btn" id="player-prev" aria-label="Previous Track">
                            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
                        </button>
                        <button class="player-btn play-pause-btn" id="player-play" aria-label="Play/Pause">
                            <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                            <svg viewBox="0 0 24 24" id="pause-icon" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <button class="player-btn" id="player-next" aria-label="Next Track">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
                        </button>
                    </div>

                    <!-- Right: Utilities (Volume, HQ, Download, Rating, Close) -->
                    <div class="player-utilities">
                        <div class="volume-container">
                            <button class="player-btn util-btn" id="volume-toggle" aria-label="Toggle Volume">
                                <svg viewBox="0 0 24 24" id="volume-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                            </button>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
                        </div>
                        <span class="util-badge hq-badge">HQ</span>
                        <a href="#" class="player-btn util-btn" id="download-track" download aria-label="Download Current Track">
                            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                        </a>
                        <button class="player-btn util-btn rating-btn" id="rating-btn">
                            <span class="rating-heart">❤</span>
                            <span class="rating-count" id="rating-count">68</span>
                        </button>
                        <button class="player-btn util-btn close-btn" id="player-close" aria-label="Close Music Console">
                            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Lower Part: Waveform Timeline progress bar -->
                <div class="player-waveform-container">
                    <span class="time-label" id="current-time">00:00</span>
                    <div class="waveform-timeline" id="waveform-timeline">
                        <div class="waveform-bars" id="waveform-bars">
                            <!-- Dynamic vertical lines for seeking -->
                        </div>
                        <div class="waveform-progress-line" id="waveform-progress-line"></div>
                        <div class="waveform-playhead" id="waveform-playhead">
                            <div class="playhead-badge" id="playhead-badge">00:00</div>
                        </div>
                    </div>
                    <span class="time-label" id="total-duration">03:04</span>
                </div>
            </div>
        </div>

    </main>

    <!-- Portal Transition Splash Overlays -->
    <div class="portal-transition">
        <div class="portal-layer portal-layer-1"></div>
        <div class="portal-layer portal-layer-2"></div>
    </div>

    <!-- Application Execution Scripts -->
    <script src="js/transition.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
